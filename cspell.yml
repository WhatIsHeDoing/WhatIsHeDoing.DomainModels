cache:
    cacheFormat: universal
    cacheStrategy: metadata
    useCache: true
failFast: true
ignorePaths:
    - cspell.yml
    - "**/*.csproj"
ignoreWords:
    - ABEHMNPRVWXY
    - APIKEY
    - appsettings
    - ASPNETCORE
    - docfx
    - HJKSTUW
    - IKMOV
    - Newtonsoft
    - noopen
    - nosniff
    - Xunit
language: en-GB,en
suggestionsTimeout: 100
useGitignore: true
words:
    - deserialise
    - deserialised
    - serialiser
    - swashbuckle
